# Developer ID signed + notarized release:
#
#   - after CI passes on main (every push or merge): version X.Y.<commit count>,
#     X.Y from MARKETING_VERSION in App/project.yml, tag created by the release
#   - on pushing a tag vX.Y.Z:  git tag v0.2.0 && git push origin v0.2.0
#   - by hand (Actions > Release > Run workflow): same as a main build
#
# Runs scripts/release.sh (the same script used locally), creates the GitHub
# release with Contacts2MdSync-<version>.zip and its .sha256, then runs
# scripts/update-release-nix.sh and pushes nix/release.json to main, so the
# flake's packages.release (the nix-darwin module's default) is that build.
# That commit is pushed with GITHUB_TOKEN, which starts no new workflow runs.
#
# Secrets (Settings > Secrets and variables > Actions; see docs/release.md):
#   DEVELOPER_ID_P12_BASE64      base64 of the exported Developer ID Application .p12
#   DEVELOPER_ID_P12_PASSWORD    password of that .p12
#   APPLE_TEAM_ID                10-character team id
#   NOTARY_API_KEY_P8_BASE64     base64 of the App Store Connect API key (.p8)
#   NOTARY_API_KEY_ID            its key id
#   NOTARY_API_ISSUER_ID         its issuer id
#   DEVELOPER_ID_PROFILE_BASE64  only with vars.NOTES_ENTITLEMENT == '1': base64
#                                of the Developer ID .provisionprofile
#
# Variables (optional): NOTES_ENTITLEMENT = '1' builds the ReleaseNotes config.
#
# Action versions are pinned by commit SHA (tag in the trailing comment).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # gh release create, push nix/release.json

# One release at a time; they all push nix/release.json to main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_run: only after a successful CI run of a push to main;
    # workflow_dispatch: only from main.
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: macos-latest
    timeout-minutes: 60
    # Optional but recommended: create a "release" environment with required
    # reviewers and put the secrets there instead of at repository level.
    environment: release
    env:
      NOTES_ENTITLEMENT: ${{ vars.NOTES_ENTITLEMENT || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested (workflow_run), else the pushed tag / main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: CFBundleVersion (and a main build's patch) is the commit count.
          fetch-depth: 0
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Only for the dev shell's xcodegen/xcbeautify; nothing is built by Nix.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Choose version and tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
              echo "::error::tag $GITHUB_REF_NAME is not vX.Y or vX.Y.Z"
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
          else
            marketing="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' App/project.yml | head -n1)"
            [[ "$marketing" =~ ^([0-9]+\.[0-9]+) ]] || {
              echo "::error::MARKETING_VERSION '$marketing' in App/project.yml is not X.Y or X.Y.Z"
              exit 1
            }
            version="${BASH_REMATCH[1]}.$(git rev-list --count HEAD)"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::notice::v$version is already released; nothing to do"
              echo "C2M_SKIP=1" >>"$GITHUB_ENV"
            fi
          fi
          echo "C2M_VERSION=$version" >>"$GITHUB_ENV"
          echo "C2M_RELEASE_SHA=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
          echo "Releasing $version from $(git rev-parse --short HEAD)"

      - name: Import Developer ID certificate into a temporary keychain
        if: env.C2M_SKIP != '1'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$P12_BASE64" && -n "$P12_PASSWORD" ]] || {
            echo "::error::DEVELOPER_ID_P12_BASE64 / DEVELOPER_ID_P12_PASSWORD secrets are not set"
            exit 1
          }
          keychain="$RUNNER_TEMP/c2m-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/developer-id.p12"
          (umask 077 && printf '%s' "$P12_BASE64" | base64 --decode >"$p12")

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$p12"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          # Search list: the temp keychain first, then the existing ones.
          existing=()
          while IFS= read -r kc; do
            kc="${kc//\"/}"
            existing+=("${kc#"${kc%%[![:space:]]*}"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -c 'Developer ID Application' >/dev/null || {
            echo "::error::the .p12 holds no Developer ID Application identity"
            exit 1
          }
          echo "C2M_SIGNING_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Install Developer ID provisioning profile (ReleaseNotes only)
        if: env.NOTES_ENTITLEMENT == '1' && env.C2M_SKIP != '1'
        env:
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$PROFILE_BASE64" ]] || {
            echo "::error::NOTES_ENTITLEMENT=1 needs the DEVELOPER_ID_PROFILE_BASE64 secret"
            exit 1
          }
          profile="$RUNNER_TEMP/c2m.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode >"$profile"
          security cms -D -i "$profile" >"$RUNNER_TEMP/c2m-profile.plist"
          uuid="$(plutil -extract UUID raw -o - "$RUNNER_TEMP/c2m-profile.plist")"
          # Xcode 16+ reads the first location; older Xcode the second.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.provisionprofile"
          done
          echo "C2M_PROVISIONING_PROFILE=$uuid" >>"$GITHUB_ENV"

      - name: Write the notarization API key
        if: env.C2M_SKIP != '1'
        env:
          P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$P8_BASE64" ]] || {
            echo "::error::NOTARY_API_KEY_P8_BASE64 secret is not set"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/notary"
          key="$RUNNER_TEMP/notary/AuthKey.p8"
          (umask 077 && printf '%s' "$P8_BASE64" | base64 --decode >"$key")
          echo "C2M_NOTARY_KEY=$key" >>"$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        if: env.C2M_SKIP != '1'
        id: release
        env:
          C2M_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          C2M_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          C2M_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: nix develop -c scripts/release.sh

      - name: Keep build logs and notarization log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs
          path: |
            build/release/*.log
            build/release/notary-*.json
            build/release/spctl.txt
          if-no-files-found: ignore

      - name: Create GitHub release
        if: env.C2M_SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.release.outputs.zip }}
          SHA256_FILE: ${{ steps.release.outputs.sha256_file }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" == "$C2M_VERSION" ]] || {
            echo "::error::built version $VERSION is not the chosen $C2M_VERSION"
            exit 1
          }
          tag_args=(--verify-tag)
          [[ "$GITHUB_REF_TYPE" == tag ]] || tag_args=(--target "$C2M_RELEASE_SHA")
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Developer ID signed and notarized build of Contacts2MdSync $VERSION."
            echo
            echo "SHA-256 of \`$(basename "$ZIP")\`: \`$SHA256\`"
            echo
            echo "Built from \`$C2M_RELEASE_SHA\`. Nix: \`nix/release.json\` on main points at this release."
          } >"$notes"
          gh release create "v$VERSION" "$ZIP" "$SHA256_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_args[@]}" \
            --title "Contacts2MdSync $VERSION" \
            --notes-file "$notes" \
            --generate-notes

      - name: Point nix/release.json at the release and push it to main
        if: env.C2M_SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          nix develop -c scripts/update-release-nix.sh "$C2M_VERSION"
          if git diff --quiet -- nix/release.json; then
            echo "nix/release.json already points at $C2M_VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "nix: release.json -> $C2M_VERSION" -- nix/release.json
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # main may have moved during the build; retry on top of it.
          for _ in 1 2 3; do
            if git push "$remote" HEAD:main; then exit 0; fi
            git pull --rebase "$remote" main
          done
          echo "::error::could not push nix/release.json to main"
          exit 1

      - name: Remove temporary keychain and keys
        if: always()
        run: |
          if [[ -n "${C2M_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$C2M_SIGNING_KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP"/c2m*.provisionprofile "$RUNNER_TEMP/c2m-profile.plist"
