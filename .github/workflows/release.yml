# Developer ID signed + notarized release, on pushing a tag vX.Y.Z.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Runs scripts/release.sh (the same script used locally), then creates the
# GitHub release with Contacts2MdSync-<version>.zip and its .sha256. Afterwards
# run scripts/update-release-nix.sh <version> and commit nix/release.json.
#
# Secrets (Settings > Secrets and variables > Actions; see docs/release.md):
#   DEVELOPER_ID_P12_BASE64      base64 of the exported Developer ID Application .p12
#   DEVELOPER_ID_P12_PASSWORD    password of that .p12
#   APPLE_TEAM_ID                10-character team id
#   NOTARY_API_KEY_P8_BASE64     base64 of the App Store Connect API key (.p8)
#   NOTARY_API_KEY_ID            its key id
#   NOTARY_API_ISSUER_ID         its issuer id
#   DEVELOPER_ID_PROFILE_BASE64  only with vars.NOTES_ENTITLEMENT == '1': base64
#                                of the Developer ID .provisionprofile
#
# Variables (optional): NOTES_ENTITLEMENT = '1' builds the ReleaseNotes config.
#
# Action versions are pinned by commit SHA (tag in the trailing comment).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    # Optional but recommended: create a "release" environment with required
    # reviewers and put the secrets there instead of at repository level.
    environment: release
    env:
      NOTES_ENTITLEMENT: ${{ vars.NOTES_ENTITLEMENT || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: CFBundleVersion is the commit count.
          fetch-depth: 0
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Only for the dev shell's xcodegen/xcbeautify; nothing is built by Nix.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y or vX.Y.Z"
            exit 1
          }

      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$P12_BASE64" && -n "$P12_PASSWORD" ]] || {
            echo "::error::DEVELOPER_ID_P12_BASE64 / DEVELOPER_ID_P12_PASSWORD secrets are not set"
            exit 1
          }
          keychain="$RUNNER_TEMP/c2m-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/developer-id.p12"
          (umask 077 && printf '%s' "$P12_BASE64" | base64 --decode >"$p12")

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$p12"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          # Search list: the temp keychain first, then the existing ones.
          existing=()
          while IFS= read -r kc; do
            kc="${kc//\"/}"
            existing+=("${kc#"${kc%%[![:space:]]*}"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -c 'Developer ID Application' >/dev/null || {
            echo "::error::the .p12 holds no Developer ID Application identity"
            exit 1
          }
          echo "C2M_SIGNING_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Install Developer ID provisioning profile (ReleaseNotes only)
        if: env.NOTES_ENTITLEMENT == '1'
        env:
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$PROFILE_BASE64" ]] || {
            echo "::error::NOTES_ENTITLEMENT=1 needs the DEVELOPER_ID_PROFILE_BASE64 secret"
            exit 1
          }
          profile="$RUNNER_TEMP/c2m.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode >"$profile"
          security cms -D -i "$profile" >"$RUNNER_TEMP/c2m-profile.plist"
          uuid="$(plutil -extract UUID raw -o - "$RUNNER_TEMP/c2m-profile.plist")"
          # Xcode 16+ reads the first location; older Xcode the second.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.provisionprofile"
          done
          echo "C2M_PROVISIONING_PROFILE=$uuid" >>"$GITHUB_ENV"

      - name: Write the notarization API key
        env:
          P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$P8_BASE64" ]] || {
            echo "::error::NOTARY_API_KEY_P8_BASE64 secret is not set"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/notary"
          key="$RUNNER_TEMP/notary/AuthKey.p8"
          (umask 077 && printf '%s' "$P8_BASE64" | base64 --decode >"$key")
          echo "C2M_NOTARY_KEY=$key" >>"$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        id: release
        env:
          C2M_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          C2M_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          C2M_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: nix develop -c scripts/release.sh

      - name: Keep build logs and notarization log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs
          path: |
            build/release/*.log
            build/release/notary-*.json
            build/release/spctl.txt
          if-no-files-found: ignore

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.release.outputs.zip }}
          SHA256_FILE: ${{ steps.release.outputs.sha256_file }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "v$VERSION" == "$GITHUB_REF_NAME" ]] || {
            echo "::error::built version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          }
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Developer ID signed and notarized build of Contacts2MdSync $VERSION."
            echo
            echo "SHA-256 of \`$(basename "$ZIP")\`: \`$SHA256\`"
            echo
            echo "Nix users: \`scripts/update-release-nix.sh $VERSION\` updates \`nix/release.json\`."
          } >"$notes"
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$SHA256_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Contacts2MdSync $VERSION" \
            --notes-file "$notes" \
            --generate-notes

      - name: Remove temporary keychain and keys
        if: always()
        run: |
          if [[ -n "${C2M_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$C2M_SIGNING_KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP"/c2m*.provisionprofile "$RUNNER_TEMP/c2m-profile.plist"
